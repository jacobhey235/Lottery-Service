services:
  - type: web
    name: photo-lottery-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: photo-lottery-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PHOTOS_DIR
        value: /data/photos
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: photos-storage
      mountPath: /data/photos
      sizeGB: 5
    healthCheckPath: /api/status

  - type: web
    name: photo-lottery-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerTarget: prod
    buildArgs:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: photo-lottery-db
    databaseName: photolottery
    plan: free
    version: "16"
