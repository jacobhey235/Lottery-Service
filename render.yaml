services:
  - type: web
    name: photo-lottery
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: photo-lottery-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: photo-lottery-db
    databaseName: photolottery
    plan: free
    version: "18"
